<title>MUNNA BHAIYA</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

:root {
    --red: #ff3030;
    --gold: #ffc857;
    --text: #ffffff;
    --muted: #d4c5c5;
    --line: rgba(255, 65, 65, .35);
}

body {
    font-family: Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 18px;
    color: var(--text);
    background:
        radial-gradient(circle at 12% 12%, rgba(255,48,48,.2), transparent 30%),
        radial-gradient(circle at 92% 85%, rgba(255,200,87,.16), transparent 32%),
        linear-gradient(145deg,#100909,#080606 55%,#210d0d);
}

.container {
    max-width: 440px;
    width: 100%;
    text-align: center;
    padding: 30px 22px 25px;
    border-radius: 30px;
    border: 1px solid var(--line);
    background: linear-gradient(145deg,rgba(43,18,18,.96),rgba(12,8,8,.98));
    box-shadow: 0 30px 90px rgba(0,0,0,.6),
                0 0 40px rgba(255,48,48,.12);
    backdrop-filter: blur(20px);
    animation: cardIn .7s ease both;
}

@keyframes cardIn {
    from { opacity: 0; transform: translateY(25px); }
    to { opacity: 1; transform: translateY(0); }
}

.badge {
    display: inline-block;
    padding: 8px 16px;
    margin-bottom: 20px;
    border-radius: 999px;
    color: var(--gold);
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 2px;
    background: rgba(255,200,87,.08);
    border: 1px solid rgba(255,200,87,.3);
}

.icon {
    width: 118px;
    height: 118px;
    margin: 5px auto 22px;
    border-radius: 50%;
    border: 4px solid var(--red);
    outline: 4px solid rgba(255,48,48,.2);
    box-shadow: 0 0 35px rgba(255,48,48,.4);
    overflow: hidden;
    animation: float 3s ease-in-out infinite;
}

.icon img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
    border-radius: 50%;
}

@keyframes float {
    50% { transform: translateY(-7px); }
}

h1 {
    font-size: clamp(27px,7vw,36px);
    font-weight: 900;
    letter-spacing: 1px;
    margin-bottom: 20px;
    color: var(--gold);
    text-shadow: 0 0 20px rgba(255,200,87,.3);
}

.sub {
    font-size: 14px;
    color: var(--muted);
    line-height: 1.7;
    margin-bottom: 20px;
}

#members {
    display: inline-block;
    margin-bottom: 20px;
    padding: 7px 15px;
    border-radius: 30px;
    font-size: 12px;
    font-weight: 800;
    color: var(--gold);
    background: rgba(255,255,255,.05);
    border: 1px solid var(--line);
}

#jbtn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    width: 100%;
    min-height: 64px;
    padding: 17px;
    border-radius: 18px;
    color: #170707;
    font-size: 18px;
    font-weight: 900;
    text-decoration: none;
    background: linear-gradient(105deg,#ff3030,#ffc857);
    box-shadow: 0 12px 35px rgba(255,48,48,.3);
    transition: .25s;
    animation: pulse 2.5s infinite;
}

#jbtn:hover {
    transform: translateY(-3px) scale(1.02);
}

#jbtn:active {
    transform: scale(.97);
}

@keyframes pulse {
    50% { box-shadow: 0 15px 45px rgba(255,48,48,.5); }
}

.features {
    display: grid;
    grid-template-columns: repeat(3,1fr);
    gap: 9px;
    margin-top: 22px;
}

.feature {
    padding: 14px 4px;
    border-radius: 15px;
    background: rgba(255,255,255,.05);
    border: 1px solid var(--line);
}

.feature b {
    display: block;
    font-size: 14px;
    color: var(--gold);
    margin-bottom: 4px;
}

.feature span {
    font-size: 9px;
    color: var(--muted);
    font-weight: 800;
    letter-spacing: 1px;
}

.footer {
    margin-top: 20px;
    padding-top: 18px;
    border-top: 1px solid var(--line);
    color: var(--muted);
    font-size: 11px;
    line-height: 1.7;
}

@media(max-width:390px) {
    .container { padding: 25px 17px; }
    .icon { width: 105px; height: 105px; }
    #jbtn { font-size: 16px; }
}

@media(prefers-reduced-motion:reduce) {
    *,*:before,*:after {
        animation: none !important;
        transition: none !important;
    }
}
</style>
</head>

<body>

<main class="container">

    <div class="badge">
        ✦ OFFICIAL TELEGRAM CHANNEL ✦
    </div>

    <div class="icon">
        <img src="logo.png" alt="MUNNA BHAIYA Logo">
    </div>

    <h1>MUNNA BHAIYA</h1>

    <div class="sub">
        Welcome to MUNNA BHAIYA Official Channel
    </div>

    <div id="members">
        JOIN OUR COMMUNITY
    </div>

    <a id="jbtn"
       href="https://t.me/+DN3W-7fswOxiYzll"
       target="_blank"
       rel="noopener noreferrer">
       ✈ JOIN CHANNEL
    </a>

    <div class="features">

        <div class="feature">
            <b>OFFICIAL</b>
            <span>CHANNEL</span>
        </div>

        <div class="feature">
            <b>INSTANT</b>
            <span>ACCESS</span>
        </div>

        <div class="feature">
            <b>FREE</b>
            <span>JOINING</span>
        </div>

    </div>

    <div class="footer">
        Opens Telegram • Tap the button to join
        MUNNA BHAIYA
    </div>

</main>

</body>
</html>
